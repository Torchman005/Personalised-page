    <script>
        //神秘小歌播放器
        const musicplay = document.getElementById('musicplay');
        const audio = document.getElementById('audio');
        const musicname = document.getElementById('musicname');

        musicplay.addEventListener('click', function () {
            if (audio.paused) {
                audio.play();
                musicname.classList.add('playing');
                setTimeout(() => {
                    musicname.textContent = '♫正在播放：フューチャー・イヴ (feat. 初音ミク)--sasakure.UK';
                    musicname.classList.remove('playing');
                }, 500);
            } else {
                audio.pause();
                musicname.classList.add('playing');
                setTimeout(() => {
                    musicname.textContent = '盒地方这是';
                    audio.currentTime = 0;
                    musicname.classList.remove('playing');
                }, 500);
            }
        });
        //Ciallo～(∠・ω< )⌒☆
        const audio1 = document.getElementById("ciallo");
        const playtext = document.getElementById("playtext");
        playtext.addEventListener('click', () => {

            } else {
                audio1.pause();
            }
        });
